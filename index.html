
<!DOCTYPE html>
<html>
<head>
    <title>Resume Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Resume Page</h1>

    <form onsubmit="return validate()">

        <p>Education qualifications:</p>
        <input type="text" id="eq"><br>

        <p>Skills possessed:</p>
        <input type="text" id="sp"><br>

        <p>Projects done:</p>
        <input type="text" id="pd"><br>

        <p>Passout Year:</p>
        <input type="text" id="py"><br>

        <button type="submit">
            Submit Resume
        </button>

    </form>

    <script src="validate.js"></script>
</body>
</html>
